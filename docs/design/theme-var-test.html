<!DOCTYPE html>
<html lang="zh-CN" data-theme="luzzy" data-mode="dark">
<head>
<meta charset="UTF-8">
<title>主题变量测试</title>
<link rel="stylesheet" href="../app/src/main/assets/ext/luzzy-theme.css">
<style>
body { background: var(--tw-gray-50); color: var(--tw-gray-900); font-family: var(--app-font-family); }
.card { background: var(--tw-gray-100); border: 1px solid var(--tw-gray-300); padding: 16px; border-radius: 12px; }
.btn { background: var(--tw-primary-600); color: var(--tw-primary-50); padding: 8px 16px; border-radius: 8px; }
.accent-text { color: var(--tw-primary-700); }
.muted { color: var(--tw-gray-600); }
</style>
</head>
<body>
<div class="card">
  <h1>暖纸书房 · 暗色</h1>
  <p class="muted">次级文字测试</p>
  <p class="accent-text">accent 文字测试</p>
  <button class="btn">发送</button>
</div>
</body>
</html>
