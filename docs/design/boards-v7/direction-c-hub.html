<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向 C · 状态枢纽（摘要卡 + 分组导航）</title>
<style>
  :root{
    --surface:#FFF4F1; --group:#FFF1ED; --card:#FCEAE5;
    --primary:#8F4C35; --primary-container:#FFDBD0; --on-primary-container:#390C00;
    --secondary:#77574D; --tertiary:#6A5E2F;
    --outline:#85736E; --outline-variant:#D8C2BB; --on-surface:#2B211E; --on-surface-var:#6E5C56;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:412px;background:var(--surface);font-family:"Alibaba PuHuiTi 3.0","Alibaba Sans","PingFang SC",system-ui,sans-serif;color:var(--on-surface)}
  .hdr{padding:20px 20px 10px}
  .hdr .big{font-family:Lora,Georgia,serif;font-size:28px;font-weight:600}
  .hdr .sub{font-size:12px;color:var(--on-surface-var);margin-top:3px}
  .page{padding:6px 14px 24px}

  /* 状态摘要卡：一眼看清「现在是什么状态」 */
  .status{background:var(--primary-container);border-radius:18px;padding:16px 16px 12px;margin-bottom:16px}
  .status .top{display:flex;align-items:center;gap:12px}
  .avatar{width:52px;height:52px;border-radius:50%;background:var(--surface);
    display:flex;align-items:center;justify-content:center;font-family:Lora,Georgia,serif;
    font-size:20px;font-weight:700;color:var(--primary);flex:none}
  .status .name{font-size:16px;font-weight:600;color:var(--on-primary-container)}
  .status .cap{font-size:12px;color:#7A4A32;margin-top:2px}
  .status .div{height:1px;background:rgba(143,76,53,.18);margin:12px 0 10px}
  .status .line{display:flex;align-items:center;gap:8px;font-size:13px;color:#5A3324}
  .status .line + .line{margin-top:6px}
  .pill{display:inline-flex;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;
    background:rgba(143,76,53,.14);color:var(--primary);white-space:nowrap;flex:none}

  .sect{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--outline);
    text-transform:uppercase;margin:14px 6px 8px}
  .group{background:var(--group);border:1px solid rgba(216,194,187,.5);border-radius:16px;overflow:hidden}
  .nav{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border-top:1px solid rgba(216,194,187,.42)}
  .nav:first-child{border-top:none}
  .nav:active{background:var(--card)}
  .nav .ic{width:34px;height:34px;border-radius:10px;background:var(--card);
    display:flex;align-items:center;justify-content:center;flex:none}
  .nav .ic svg{width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:2}
  .nav .grow{flex:1;min-width:0}
  .nav .lbl{font-size:14px;font-weight:500}
  .nav .sup{font-size:12px;color:var(--on-surface-var);margin-top:1px}
  .nav .val{font-size:13px;color:var(--outline);white-space:nowrap}
  .chev{color:var(--outline-variant);font-size:16px}
  .sw{width:42px;height:24px;border-radius:12px;background:var(--primary);position:relative;flex:none}
  .sw::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff}
  .foot{font-size:11.5px;color:var(--outline);line-height:1.6;margin:12px 6px 0}
</style>
</head>
<body>
<div class="hdr">
  <div class="big">设置</div>
  <div class="sub">LuzzyRP v3.0.0 · 织机 Loom</div>
</div>
<div class="page">

  <div class="status">
    <div class="top">
      <div class="avatar">鹿</div>
      <div>
        <div class="name">未设置</div>
        <div class="cap">当前角色 · 偏好未填写</div>
      </div>
    </div>
    <div class="div"></div>
    <div class="line"><span class="pill">API 未配置</span> 模型与供应商在聊天页输入岛的「模型」面板配置</div>
    <div class="line">版本 <b>3.0.0</b> · 数据 2 张角色卡 / 6 条会话</div>
  </div>

  <div class="sect">常用</div>
  <div class="group">
    <div class="nav">
      <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></div>
      <div class="grow"><div class="lbl">用户设置</div><div class="sup">角色名 · 偏好设定</div></div>
      <div class="val">未设置</div><span class="chev">›</span>
    </div>
    <div class="nav">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01"/></svg></div>
      <div class="grow"><div class="lbl">API 连接</div><div class="sup">供应商 · 模型 · 端点</div></div>
      <div class="val">未配置</div><span class="chev">›</span>
    </div>
  </div>

  <div class="sect">数据</div>
  <div class="group">
    <div class="nav">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg></div>
      <div class="grow"><div class="lbl">导入与导出</div><div class="sup">预设 / 世界书 / 角色卡</div></div>
      <span class="chev">›</span>
    </div>
    <div class="nav">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M9 17H7a4 4 0 0 1 0-8 6 6 0 0 1 11.3-1.9A4.5 4.5 0 0 1 17.5 17H15"/><path d="M12 12v9m-3.5-3.5L12 21l3.5-3.5"/></svg></div>
      <div class="grow"><div class="lbl">迁移报告</div><div class="sup">从旧版搬来了什么</div></div>
      <span class="chev">›</span>
    </div>
  </div>

  <div class="sect">显示与内容</div>
  <div class="group">
    <div class="nav">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 20h6M12 5v15"/></svg></div>
      <div class="grow"><div class="lbl">字号</div><div class="sup">正文与 Markdown（12–20px）</div></div>
      <div class="val">16px</div><span class="chev">›</span>
    </div>
    <div class="nav">
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg></div>
      <div class="grow"><div class="lbl">文风过滤</div><div class="sup">删改 AI 措辞（三处同源）</div></div>
      <div class="sw"></div>
    </div>
  </div>

  <div class="foot">状态摘要一眼看清「当前是谁、连没连、装了多少东西」；点任一行进入子页。</div>
</div>
</body>
</html>
