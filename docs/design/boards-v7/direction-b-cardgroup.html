<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>方向 B · 折叠卡组（rikkahub CardGroup 形态）</title>
<style>
  :root{
    --surface:#FFF4F1; --group:#FFF1ED; --card:#FCEAE5;
    --primary:#8F4C35; --primary-container:#FFDBD0;
    --outline:#85736E; --outline-variant:#D8C2BB; --on-surface:#2B211E; --on-surface-var:#6E5C56;
    --tertiary-container:#F4E2A7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:412px;background:var(--surface);font-family:"Alibaba PuHuiTi 3.0","Alibaba Sans","PingFang SC",system-ui,sans-serif;color:var(--on-surface)}
  .hdr{padding:18px 20px 6px}
  .hdr .big{font-family:Lora,Georgia,serif;font-size:34px;font-weight:600;letter-spacing:.5px}
  .hdr .sub{font-size:12px;color:var(--on-surface-var);margin-top:2px}
  .page{padding:8px 14px 24px}
  .sect{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--outline);text-transform:uppercase;margin:16px 6px 8px}
  .group{background:var(--group);border:1px solid rgba(216,194,187,.5);border-radius:20px;padding:6px}
  .entry{display:flex;align-items:center;gap:12px;min-height:48px;padding:8px 12px;border-radius:12px}
  .entry + .entry{border-top:1px solid rgba(216,194,187,.4);border-radius:0 0 12px 12px}
  .entry:active{background:var(--card)}
  .entry .ic{width:34px;height:34px;border-radius:10px;background:var(--card);display:flex;align-items:center;justify-content:center;flex:none}
  .entry .ic svg{width:18px;height:18px;stroke:var(--primary);fill:none;stroke-width:2}
  .entry .grow{flex:1;min-width:0}
  .entry .lbl{font-size:14px;font-weight:500}
  .entry .sup{font-size:12px;color:var(--on-surface-var);margin-top:1px}
  .entry .val{font-size:13px;color:var(--outline)}
  .entry .chev{color:var(--outline-variant);font-size:15px}
  .badge{display:inline-flex;font-size:11px;font-weight:600;color:var(--outline);border:1px solid var(--outline-variant);border-radius:999px;padding:2px 9px}
  .sw{width:42px;height:24px;border-radius:12px;background:var(--primary);position:relative;flex:none}
  .sw::after{content:"";position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff}
  .slider{position:relative;height:20px;margin:6px 0 2px}
  .slider .track{position:absolute;left:0;right:0;top:8px;height:4px;border-radius:2px;background:var(--primary-container)}
  .slider .fill{position:absolute;left:0;width:50%;top:8px;height:4px;border-radius:2px;background:var(--primary)}
  .slider .dot{position:absolute;top:2.5px;left:50%;width:15px;height:15px;border-radius:50%;background:var(--primary);transform:translateX(-50%)}
  .inline-param .k{display:flex;justify-content:space-between;align-items:baseline}
  .inline-param .k b{color:var(--primary);font-size:13px}
</style>
</head>
<body>
<div class="hdr">
  <div class="big">设置</div>
  <div class="sub">LuzzyRP v3.0.0 · 织机 Loom</div>
</div>
<div class="page">

  <div class="sect">用户</div>
  <div class="group">
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg></div>
      <div class="grow"><div class="lbl">角色名</div></div><div class="val">未设置</div><span class="chev">›</span></div>
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h10M4 18h7"/></svg></div>
      <div class="grow"><div class="lbl">偏好设定</div></div><div class="val">未填写</div><span class="chev">›</span></div>
  </div>

  <div class="sect">连接</div>
  <div class="group">
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><path d="M5 12a10 10 0 0 1 14 0M8.5 15.5a5 5 0 0 1 7 0M12 19h.01"/></svg></div>
      <div class="grow"><div class="lbl">API 提供商</div></div><span class="badge">未配置</span></div>
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></div>
      <div class="grow"><div class="lbl">聊天模型</div></div><div class="val">未配置</div><span class="chev">›</span></div>
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1.5 1.5M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7L12.5 19"/></svg></div>
      <div class="grow"><div class="lbl">端点</div><div class="sup">模型与供应商在聊天页输入岛的「模型」面板配置</div></div><div class="val">—</div></div>
  </div>

  <div class="sect">数据</div>
  <div class="group">
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 15V3m0 0L8 7m4-4l4 4M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg></div>
      <div class="grow"><div class="lbl">导出</div><div class="sup">预设 / 世界书 / 角色卡（.json 原样）</div></div><span class="chev">›</span></div>
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg></div>
      <div class="grow"><div class="lbl">导入</div><div class="sup">整组覆盖；角色卡同卡覆盖、外来卡新建</div></div><span class="chev">›</span></div>
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><path d="M9 17H7a4 4 0 0 1 0-8 6 6 0 0 1 11.3-1.9A4.5 4.5 0 0 1 17.5 17H15"/><path d="M12 12v9m-3.5-3.5L12 21l3.5-3.5"/></svg></div>
      <div class="grow"><div class="lbl">迁移报告</div><div class="sup">从旧版搬来了什么</div></div><span class="chev">›</span></div>
  </div>

  <div class="sect">通用</div>
  <div class="group">
    <div class="entry inline-param" style="display:block">
      <div class="k"><span class="lbl">字号</span><b>16px</b></div>
      <div class="slider"><div class="track"></div><div class="fill"></div><div class="dot"></div></div>
      <div class="sup" style="font-size:12px;color:var(--on-surface-var)">12–20px，拖动实时预览、松手保存</div>
    </div>
    <div class="entry"><div class="ic"><svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 20h6M12 5v15"/></svg></div>
      <div class="grow"><div class="lbl">文风过滤</div><div class="sup">删改 AI 措辞（三处同源；照上游默认开）</div></div><div class="sw"></div></div>
  </div>

</div>
</body>
</html>
