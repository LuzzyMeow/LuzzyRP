<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>方向 C · 目录页（会话总览）</title>
<style>
/* ============================================================
   方向 C · 逻辑三「最佳设计师」= iA Writer 的 Library
   主张：排版即界面。零卡片、零 chip、零分隔线 —— 只靠字号/缩进/留白分层
   品牌契约：DESIGN-compose §2 令牌 + Lora / PuHuiTi 本地 TTF
   ============================================================ */
@font-face { font-family:'Lora'; src:url('../boards-v4/fonts/Lora-Regular.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'Lora'; src:url('../boards-v4/fonts/Lora-Italic.woff2') format('woff2'); font-weight:400; font-style:italic; }
@font-face { font-family:'PuHuiTi'; src:url('../boards-v4/fonts/AlibabaPuHuiTi-3-55-Regular.woff2') format('woff2'); font-weight:400; }
@font-face { font-family:'PuHuiTi'; src:url('../boards-v4/fonts/AlibabaPuHuiTi-3-65-Medium.woff2') format('woff2'); font-weight:500; }

:root{
  --surface:#FFF4F1; --outline:#85736E; --outline-variant:#D8C2BB;
  --on:#231917; --primary:#8F4C35; --secondary:#77574D; --tertiary:#6A5E2F;
}
html[data-theme="dark"]{
  --surface:#231917; --outline:#A08D87; --outline-variant:#53433F;
  --on:#F1DFDA; --primary:#FFB59D; --secondary:#E7BDB1; --tertiary:#D7C68D;
}
*{ box-sizing:border-box; margin:0; padding:0; }
body{ background:#6b625f; display:flex; justify-content:center; padding:24px; }
.phone{ width:390px; height:844px; background:var(--surface); color:var(--on);
  font-family:'PuHuiTi',system-ui; overflow:hidden; -webkit-font-smoothing:antialiased; }
.status{ height:24px; display:flex; align-items:center; justify-content:space-between;
  padding:0 16px; font-size:11px; opacity:.72; }
.status .glyphs{ display:flex; gap:5px; align-items:center; }
.appbar{ height:64px; display:flex; align-items:center; gap:14px; padding:0 16px; }
.appbar .burger{ width:22px; height:16px; display:flex; flex-direction:column; justify-content:space-between; }
.appbar .burger i{ display:block; height:1.6px; background:var(--on); opacity:.86; border-radius:2px; }
.appbar h1{ font-family:'Lora',serif; font-size:20px; font-weight:400; }

/* 目录体：一整列文本，靠留白分章 —— 没有容器 */
.contents{ height:calc(844px - 88px); padding:4px 28px 0; overflow:hidden; }

/* 章（角色）：Lora 小号 + 疏字距 + 上留白，像书的章次 */
.chapter{ margin-top:30px; }
.chapter:first-child{ margin-top:2px; }
.chapter .head{ display:flex; align-items:baseline; gap:10px; }
.chapter .num{ font-family:'Lora',serif; font-size:11px; color:var(--outline);
  letter-spacing:.08em; font-variant-numeric:tabular-nums; }
.chapter .title{ font-family:'Lora',serif; font-size:17px; letter-spacing:.02em; }
.chapter .tally{ margin-left:auto; font-size:11px; color:var(--outline); font-variant-numeric:tabular-nums; }

/* 节（分支）：缩进 + 左侧发丝竖线（唯一的「线」，且不是分隔线而是缩进标记） */
.entry{ position:relative; margin-top:14px; padding-left:14px; }
.entry::before{ content:''; position:absolute; left:0; top:3px; bottom:3px;
  width:1px; background:var(--outline-variant); opacity:.85; }
.entry .branch{ font-size:13.5px; }
.entry .branch .sub{ font-size:11px; color:var(--outline); margin-left:8px; }
.entry .branch .n{ font-family:'Lora',serif; font-size:11px; color:var(--outline);
  margin-left:8px; font-variant-numeric:tabular-nums; }
/* 预览：正文体、比分支名更小更淡，2 行封顶 —— 它才是「想起来」的凭据 */
.entry .preview{ margin-top:5px; font-size:13px; line-height:19px; color:var(--secondary);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.entry.empty .preview{ font-family:'Lora',serif; font-style:italic; color:var(--outline); font-size:12.5px; }

/* 唯一一处 primary：正在写的那一条，用一个小空心圆标出来（不是色块、不是徽标） */
.entry.current .branch::after{ content:''; display:inline-block; width:5px; height:5px;
  margin-left:9px; border-radius:50%; border:1.2px solid var(--primary); vertical-align:1px; }
</style>
</head>
<body>
<div class="phone">
  <div class="status">
    <span>09:41</span>
    <span class="glyphs">
      <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><rect x="0" y="7" width="2.5" height="4" rx="1" fill="currentColor"/><rect x="4" y="5" width="2.5" height="6" rx="1" fill="currentColor"/><rect x="8" y="2.5" width="2.5" height="8.5" rx="1" fill="currentColor"/><rect x="12" y="0" width="2.5" height="11" rx="1" fill="currentColor" opacity=".45"/></svg>
      <svg width="14" height="11" viewBox="0 0 14 11" fill="none"><path d="M7 9.4 4.6 7.1a3.5 3.5 0 0 1 4.8 0L7 9.4Z" fill="currentColor"/><path d="M2.2 4.6a7 7 0 0 1 9.6 0" stroke="currentColor" stroke-width="1.3" fill="none"/><path d="M4.6 7.1a3.5 3.5 0 0 1 4.8 0" stroke="currentColor" stroke-width="1.3" fill="none"/></svg>
      <svg width="22" height="11" viewBox="0 0 22 11" fill="none"><rect x="0.5" y="0.5" width="18" height="10" rx="3" stroke="currentColor" opacity=".5"/><rect x="2" y="2" width="13" height="7" rx="1.6" fill="currentColor"/><rect x="20" y="3.5" width="1.6" height="4" rx="0.8" fill="currentColor" opacity=".5"/></svg>
    </span>
  </div>

  <div class="appbar">
    <span class="burger"><i></i><i></i><i></i></span>
    <h1>会话</h1>
  </div>

  <div class="contents">
    <div class="chapter">
      <div class="head"><span class="num">01</span><span class="title">Vanio</span><span class="tally">2 条 · 10 楼</span></div>
      <div class="entry current">
        <div class="branch">主线<span class="n">5</span></div>
        <div class="preview">靠窗那张椅子是藤的，坐下去咯吱一声。从这里能看见楼下的街，雨把招牌糊成一片色块，没什么人在走。</div>
      </div>
      <div class="entry">
        <div class="branch">留在书店<span class="sub">自第 3 楼分出</span><span class="n">5</span></div>
        <div class="preview">&lt;thinking&gt; [情景意图分析] 林澈明确做了两件事：把毛巾搭在椅背上，然后问 Vanio 要不要一起喝点什么。</div>
      </div>
    </div>

    <div class="chapter">
      <div class="head"><span class="num">02</span><span class="title">谢昭</span><span class="tally">1 条 · 1 楼</span></div>
      <div class="entry">
        <div class="branch">主线<span class="n">1</span></div>
        <div class="preview">（会议室里只剩下两个人。）「方案我看过了。」把纸推到桌子中间。</div>
      </div>
    </div>

    <div class="chapter">
      <div class="head"><span class="num">03</span><span class="title">夏梧</span><span class="tally">1 条 · 0 楼</span></div>
      <div class="entry empty">
        <div class="branch">主线<span class="n">0</span></div>
        <div class="preview">还没有开过口</div>
      </div>
    </div>

    <div class="chapter">
      <div class="head"><span class="num">04</span><span class="title">旧档角色</span><span class="tally">1 条 · 0 楼</span></div>
      <div class="entry empty">
        <div class="branch">主线<span class="n">0</span></div>
        <div class="preview">还没有开过口</div>
      </div>
    </div>

    <div class="chapter">
      <div class="head"><span class="num">05</span><span class="title">仅旧库角色</span><span class="tally">1 条 · 2 楼</span></div>
      <div class="entry">
        <div class="branch">主线<span class="n">2</span></div>
        <div class="preview">你在哪一年？</div>
      </div>
    </div>
  </div>
</div>
<script>
  var m = /theme=(\w+)/.exec(location.search);
  if (m) document.documentElement.dataset.theme = m[1];
</script>
</body>
</html>
